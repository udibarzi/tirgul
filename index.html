<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגול מתמטיקה</title>
  <link rel="stylesheet" href="app/style.css">
  <style>
    /* ======= Landing Page Design ======= */

    .welcome-card {
      background: var(--color-card);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 8px 40px rgba(30, 41, 59, 0.08), 0 1px 3px rgba(0,0,0,0.04);
      width: 100%;
      max-width: 420px;
      animation: screenIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(226, 232, 240, 0.6);
      position: relative;
    }

    /* Decorative corner accent */
    .welcome-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--color-primary-glow) 0%, transparent 60%);
      border-radius: 0 20px 0 0;
      pointer-events: none;
    }

    .returning-greeting {
      font-size: 1.2em;
      margin-bottom: var(--space-md);
      text-align: center;
    }
    .change-name {
      font-size: 0.8em;
      color: var(--color-text-light);
      cursor: pointer;
      text-decoration: underline;
      margin-top: var(--space-sm);
      text-align: center;
      display: block;
    }

    /* Stats card */
    .total-stats {
      text-align: center;
      padding: var(--space-md) var(--space-lg);
      background: linear-gradient(135deg, rgba(74, 86, 226, 0.06) 0%, rgba(99, 102, 241, 0.04) 100%);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-lg);
      border: 1px solid rgba(74, 86, 226, 0.08);
    }
    .total-stats .stat-label {
      font-size: 0.85em;
      color: var(--color-text-light);
      margin-bottom: 2px;
    }
    .total-stats .big-number {
      font-family: var(--font-display);
      font-size: 2.4em;
      font-weight: 400;
      color: var(--color-primary);
      animation: countUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Grade / Gender picker */
    .picker-grid {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: var(--space-md);
    }
    .picker-card {
      background: var(--color-card);
      border: 2px solid var(--color-border);
      border-radius: 16px;
      padding: 20px 24px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      min-width: 100px;
      flex: 1;
      position: relative;
    }
    .picker-card:hover {
      transform: translateY(-4px);
      border-color: var(--color-primary);
      box-shadow: 0 8px 24px rgba(74, 86, 226, 0.18);
    }
    .picker-card:active {
      transform: translateY(-1px);
    }
    .picker-card .picker-icon {
      font-size: 2.2em;
      margin-bottom: 8px;
      display: block;
      transition: transform 0.25s;
    }
    .picker-card:hover .picker-icon {
      transform: scale(1.15);
    }
    .picker-card .picker-label {
      font-weight: 600;
      font-size: 1.05em;
      color: var(--color-text);
    }
    .picker-subtitle {
      text-align: center;
      color: var(--color-text-light);
      margin-bottom: var(--space-sm);
      font-size: 0.95em;
    }

    /* Grade badge */
    .grade-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--color-primary), #6366F1);
      color: white;
      border-radius: 20px;
      padding: 3px 14px;
      font-size: 0.8em;
      font-weight: 600;
      margin-right: 8px;
      letter-spacing: 0.02em;
    }

    /* Settings row */
    .settings-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-top: var(--space-sm);
      flex-wrap: wrap;
    }
    .settings-link {
      font-size: 0.8em;
      color: var(--color-text-light);
      cursor: pointer;
      text-decoration: none;
      padding: 2px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .settings-link:hover {
      color: var(--color-primary);
      background: var(--color-primary-glow);
    }
    .settings-divider {
      color: var(--color-border);
      font-size: 0.8em;
    }

    /* Screen back link (grade/gender pickers) */
    .screen-back-link {
      display: block;
      text-align: center;
      margin-top: var(--space-lg);
      color: var(--color-text-light);
      font-size: 0.9em;
      cursor: pointer;
      text-decoration: none;
      padding: 6px 16px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .screen-back-link:hover {
      color: var(--color-primary);
      background: var(--color-primary-glow);
    }

    /* Topic card stagger animation */
    .topic-card.animate-in {
      animation: cardStagger 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    /* Speed drill card accent */
    .topic-card.speed-card {
      border-color: var(--color-warning);
      background: linear-gradient(135deg, #FFFBEB 0%, #FFFFFF 40%);
    }
    .topic-card.speed-card::before {
      background: var(--color-warning);
      opacity: 1;
    }
    .topic-card.speed-card:hover {
      border-color: var(--color-warning);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.2);
    }

    /* Who's practicing? */
    .learner-card-pick { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 120px; }
    .learner-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--color-primary), #6366F1);
      color: white; font-family: var(--font-display); font-size: 1.5em;
    }
    .learner-add .learner-avatar { background: var(--color-border); color: var(--color-text-light); }
    .learner-grade { font-size: 0.8em; color: var(--color-text-light); }

    /* First-setup mapping rows */
    .map-row { border: 1px solid var(--color-border); border-radius: 14px; padding: 12px; margin-top: 12px; }
    .map-name { font-weight: 600; margin-bottom: 8px; text-align: center; }
    .map-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .map-btn {
      font: inherit; padding: 8px 16px; border-radius: 10px; cursor: pointer;
      border: 2px solid var(--color-primary); background: var(--color-card); color: var(--color-primary); font-weight: 600;
    }
    .map-btn.map-none { border-color: var(--color-border); color: var(--color-text-light); font-weight: 400; }

    /* This week's goal line */
    .week-line {
      background: var(--color-primary-glow); border-radius: var(--radius-md);
      padding: 10px 14px; margin-bottom: var(--space-md); font-size: 0.92em; text-align: center;
    }
    .week-line .progress-bar { margin-top: 6px; background: rgba(255,255,255,0.7); }
    .week-line.met { background: var(--color-success-bg); }
    .week-line.met .progress-fill { background: var(--color-success); }
    .week-cheer { font-weight: 700; color: var(--color-success); margin-bottom: 2px; }
    .week-num { font-weight: 600; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <!-- Screen 1: Name Entry (first visit) -->
  <div id="bootScreen" class="landing-container"><div class="picker-subtitle" style="text-align:center;">טוען...</div></div>
  <div id="nameScreen" class="landing-container hidden">
    <div class="welcome-card">
      <div class="landing-logo text-center">🧮</div>
      <h1 class="landing-title text-center">תרגול מתמטיקה</h1>
      <p class="landing-subtitle text-center">מוכנים להתחיל לתרגל?</p>
      <div class="name-input-group">
        <input type="text" id="nameInput" class="name-input"
               placeholder="מה השם שלך?"
               autocomplete="off" autofocus>
      </div>
      <div class="text-center">
        <button id="startBtn" class="start-btn" disabled>בואו נתחיל!</button>
      </div>
    </div>
  </div>

  <!-- Screen 2: Grade Picker -->
  <div id="gradeScreen" class="landing-container hidden">
    <div class="welcome-card">
      <div class="landing-logo text-center">📚</div>
      <h1 class="landing-title text-center">שלום <span id="gradeScreenName"></span>!</h1>
      <p class="picker-subtitle">באיזו כיתה?</p>
      <div class="picker-grid" id="gradeGrid">
        <!-- Populated dynamically from manifest grades -->
      </div>
      <a class="screen-back-link" id="gradeBackLink">חזרה</a>
    </div>
  </div>

  <!-- Screen 3: Gender Picker -->
  <div id="genderScreen" class="landing-container hidden">
    <div class="welcome-card">
      <div class="landing-logo text-center">👋</div>
      <h1 class="landing-title text-center">עוד שנייה מתחילים!</h1>
      <p class="picker-subtitle">בן או בת?</p>
      <div class="picker-grid">
        <div class="picker-card" onclick="selectGender('male')">
          <span class="picker-icon">👦</span>
          <span class="picker-label">בן</span>
        </div>
        <div class="picker-card" onclick="selectGender('female')">
          <span class="picker-icon">👧</span>
          <span class="picker-label">בת</span>
        </div>
      </div>
      <a class="screen-back-link" id="genderBackLink">חזרה</a>
    </div>
  </div>

  <!-- Who's practicing? -->
  <div id="learnerScreen" class="landing-container hidden">
    <div class="welcome-card">
      <div class="landing-logo text-center">👋</div>
      <h1 class="landing-title text-center" id="learnerTitle">מי מתרגלת?</h1>
      <div class="picker-grid" id="learnerGrid"></div>
    </div>
  </div>

  <!-- First setup on a device that was already used -->
  <div id="mapScreen" class="landing-container hidden">
    <div class="welcome-card">
      <div class="landing-logo text-center">🔗</div>
      <h1 class="landing-title text-center">רגע לפני שמתחילים</h1>
      <p class="picker-subtitle">מי תרגלה במכשיר הזה עד עכשיו? כך ההתקדמות שלה תישמר.</p>
      <div id="mapList"></div>
    </div>
  </div>

  <!-- Screen 4: Topic Selection -->
  <div id="topicsScreen" class="topics-container hidden">
    <div class="topics-header">
      <h1>שלום <span class="user-name" id="displayName"></span> 👋</h1>
      <div>
        <span class="grade-badge" id="gradeBadge"></span>
      </div>
      <div class="settings-row">
        <a class="settings-link" id="changeNameLink">שינוי שם</a>
        <span class="settings-divider" id="settingsDivider">|</span>
        <a class="settings-link" id="changeGradeLink">שינוי כיתה</a>
      </div>
    </div>

    <div class="week-line hidden" id="weekLine">
      <div class="week-text" id="weekText"></div>
      <div class="progress-bar"><div class="progress-fill" id="weekFill"></div></div>
    </div>

    <div class="ladder-card hidden" id="ladderCard"></div>

    <div class="total-stats" id="totalStats">
      <div class="stat-label">תשובות נכונות</div>
      <div class="big-number" id="totalCorrect">0</div>
    </div>

    <div class="topics-grid" id="topicsGrid">
      <!-- Populated dynamically from manifest -->
    </div>
  </div>

  <script src="app/core.js"></script>
  <script src="app/tracker.js"></script>
  <script src="app/ladder.js"></script>
  <script>
    const T = window.Tracker;
    let manifest = null;
    // A learner being added through the name → grade → gender flow
    const adding = { name: '', grade: 0 };

    function pm() { return new ProgressManager(T.progressPrefix()); }
    function chosenThisVisit() { try { return sessionStorage.getItem('tirgul_chosen') === '1'; } catch (e) { return false; } }
    function markChosen() { try { sessionStorage.setItem('tirgul_chosen', '1'); } catch (e) {} }
    function sheetProfiles() { return T.getProfiles().filter(p => p.fromSheet); }
    function isConfigured() { return !!T.getConfig() && sheetProfiles().length > 0; }
    function gradeInfo(g) { return (manifest.grades || []).find(x => x.id === g); }
    // The parent (or any learner without a school grade) sees only the English ladder.
    // Sheet learners whose grade is empty, 0 or not in the manifest count too — no grade-picker dead end.
    function isLadderOnly(p) { return !!p && (!!p.ladderOnly || (!!p.fromSheet && !gradeInfo(p.grade))); }
    function hasGradeOrLadder(p) { return !!p && (isLadderOnly(p) || !!gradeInfo(p.grade)); }
    const ADULT_LABEL = 'מבוגר/ת — רק המסלול';

    // ---- Initialization ----
    async function init() {
      manifest = await loadManifest('content/manifest.json');

      if (!manifest) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;">שגיאה בטעינת התוכן. נסו לרענן את הדף.</div>';
        return;
      }

      T.migrateLegacy();
      if (T.applySetupHash(location.hash)) {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      }
      T.setPage({ topic: 'menu' });
      T.attach();
      if (T.getConfig()) await Promise.race([T.fetchLearners(), new Promise(r => setTimeout(r, 4000))]);
      route();
    }

    function route() {
      if (T.getConfig() && T.unmappedLocalNames().length) return showMapScreen();
      const sheet = sheetProfiles();
      const cur = T.getCurrent();
      if (T.getConfig() && sheet.length) {
        if (sheet.length === 1) { T.setCurrent(sheet[0].name); return showTopics(); }
        if (cur && chosenThisVisit() && sheet.some(p => p.name === cur.name)) return showTopics();
        return showLearnerScreen();
      }
      // Not set up: the original name → grade → gender flow
      if (!cur) return showNameScreen();
      if (!hasGradeOrLadder(cur)) return showGradePicker(cur.name);
      if (!getGender()) return showGenderPicker(cur.name);
      showTopics();
    }

    function getGender() {
      try { return localStorage.getItem('math_app_gender') || ''; } catch (e) { return ''; }
    }

    // ---- Who's practicing? ----
    function showLearnerScreen() {
      const list = isConfigured() ? sheetProfiles() : T.getProfiles();
      if (!list.length && !isConfigured()) return showNameScreen();
      hideAll();
      document.getElementById('learnerScreen').classList.remove('hidden');
      document.getElementById('learnerTitle').textContent = list.some(p => p.gender === 'male') ? 'מי מתרגל/ת?' : 'מי מתרגלת?';
      const grid = document.getElementById('learnerGrid');
      grid.innerHTML = '';
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'picker-card learner-card-pick';
        const g = gradeInfo(p.grade);
        card.innerHTML = '<span class="learner-avatar"></span><span class="picker-label"></span><span class="learner-grade"></span>';
        card.querySelector('.learner-avatar').textContent = p.name.charAt(0);
        card.querySelector('.picker-label').textContent = p.name;
        card.querySelector('.learner-grade').textContent = g ? g.name : (isLadderOnly(p) ? 'מסלול אנגלית' : '');
        card.addEventListener('click', () => {
          T.setCurrent(p.name);
          markChosen();
          if (!hasGradeOrLadder(T.getCurrent())) return showGradePicker(p.name);
          showTopics();
        });
        grid.appendChild(card);
      });
      if (!isConfigured()) {
        const add = document.createElement('div');
        add.className = 'picker-card learner-card-pick learner-add';
        add.innerHTML = '<span class="learner-avatar">+</span><span class="picker-label">הוספה</span><span class="learner-grade">שם חדש</span>';
        add.addEventListener('click', () => showNameScreen());
        grid.appendChild(add);
      }
    }

    // ---- First setup: whose progress is already on this device? ----
    function showMapScreen() {
      hideAll();
      document.getElementById('mapScreen').classList.remove('hidden');
      const box = document.getElementById('mapList');
      box.innerHTML = '';
      const sheet = sheetProfiles();
      T.unmappedLocalNames().forEach(from => {
        const row = document.createElement('div');
        row.className = 'map-row';
        const name = document.createElement('div');
        name.className = 'map-name';
        name.textContent = from;
        const btns = document.createElement('div');
        btns.className = 'map-btns';
        sheet.map(p => p.name).concat([null]).forEach(to => {
          const b = document.createElement('button');
          b.className = 'map-btn' + (to ? '' : ' map-none');
          b.textContent = to || 'אף אחת';
          b.addEventListener('click', () => {
            T.mapLearner(from, to);
            if (T.unmappedLocalNames().length) showMapScreen(); else route();
          });
          btns.appendChild(b);
        });
        row.appendChild(name);
        row.appendChild(btns);
        box.appendChild(row);
      });
    }

    // ---- Name Screen ----
    function showNameScreen() {
      hideAll();
      document.getElementById('nameScreen').classList.remove('hidden');

      const input = document.getElementById('nameInput');
      const btn = document.getElementById('startBtn');

      input.value = '';
      btn.disabled = true;

      // Clone to remove old listeners
      const newInput = input.cloneNode(true);
      input.parentNode.replaceChild(newInput, input);
      const newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);

      newInput.addEventListener('input', () => {
        newBtn.disabled = !newInput.value.trim();
      });

      newInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && newInput.value.trim()) {
          startWithName(newInput.value.trim());
        }
      });

      newBtn.addEventListener('click', () => {
        if (newInput.value.trim()) startWithName(newInput.value.trim());
      });

      setTimeout(() => newInput.focus(), 100);
    }

    function startWithName(name) {
      adding.name = name;
      adding.grade = 0;
      showGradePicker(name);
    }

    // ---- Grade Picker ----
    function showGradePicker(name) {
      hideAll();
      document.getElementById('gradeScreen').classList.remove('hidden');
      document.getElementById('gradeScreenName').textContent = name;

      const grid = document.getElementById('gradeGrid');
      grid.innerHTML = '';

      (manifest.grades || []).forEach(g => {
        const card = document.createElement('div');
        card.className = 'picker-card';
        card.innerHTML = `<span class="picker-icon">${g.icon}</span><span class="picker-label">${g.name}</span>`;
        card.addEventListener('click', () => selectGrade(g.id));
        grid.appendChild(card);
      });
      const adult = document.createElement('div');
      adult.className = 'picker-card';
      adult.innerHTML = `<span class="picker-icon">🪜</span><span class="picker-label">${ADULT_LABEL}</span>`;
      adult.addEventListener('click', () => selectGrade(0));
      grid.appendChild(adult);

      // Back link: go to topics if the current learner is complete, else name screen
      document.getElementById('gradeBackLink').onclick = () => {
        adding.name = '';
        const cur = T.getCurrent();
        if (hasGradeOrLadder(cur) && getGender()) showTopics();
        else showNameScreen();
      };
    }

    function selectGrade(gradeId) {
      // gradeId 0 = adult, ladder only
      if (adding.name) {
        adding.grade = gradeId;
        showGenderPicker(adding.name);
        return;
      }
      const cur = T.getCurrent();
      if (!cur) return showNameScreen();
      T.addLocalProfile({ ...cur, grade: gradeId, ladderOnly: !gradeId });
      T.setCurrent(cur.name);
      if (getGender()) showTopics(); else showGenderPicker(cur.name);
    }

    // ---- Gender Picker ----
    function showGenderPicker(name) {
      hideAll();
      document.getElementById('genderScreen').classList.remove('hidden');

      // Back link: go back to grade picker
      document.getElementById('genderBackLink').onclick = () => {
        showGradePicker(name);
      };
    }

    function selectGender(gender) {
      if (adding.name) {
        T.addLocalProfile({ name: adding.name, grade: adding.grade, gender, ladderOnly: !adding.grade });
        T.setCurrent(adding.name);
        adding.name = '';
      } else {
        const cur = T.getCurrent();
        if (!cur) return showNameScreen();
        T.addLocalProfile({ ...cur, gender });
        T.setCurrent(cur.name);
      }
      showTopics();
    }

    // ---- Topics Screen ----
    function showTopics() {
      const cur = T.getCurrent();
      if (!cur) return showNameScreen();
      hideAll();
      document.getElementById('topicsScreen').classList.remove('hidden');
      document.getElementById('displayName').textContent = cur.name;

      const info = gradeInfo(cur.grade);
      const ladderOnly = isLadderOnly(cur);
      document.getElementById('gradeBadge').textContent = info ? info.name : (ladderOnly ? 'מסלול אנגלית' : '');

      const nameLink = document.getElementById('changeNameLink');
      nameLink.textContent = isConfigured() ? 'החלפה' : 'שינוי שם';
      nameLink.onclick = () => showLearnerScreen();

      // Grade comes from the sheet for sheet learners
      document.getElementById('changeGradeLink').classList.toggle('hidden', cur.fromSheet || ladderOnly);
      document.getElementById('settingsDivider').classList.toggle('hidden', cur.fromSheet || ladderOnly);
      document.getElementById('changeGradeLink').onclick = () => showGradePicker(cur.name);

      try { renderLadderCard(cur); }
      catch (e) { document.getElementById('ladderCard').classList.add('hidden'); }   // the ladder never hides practice
      document.getElementById('totalStats').classList.toggle('hidden', ladderOnly);
      document.getElementById('topicsGrid').classList.toggle('hidden', ladderOnly);
      if (ladderOnly) document.getElementById('topicsGrid').innerHTML = '';
      else renderTopicGrid(cur);
      updateTotalStats();
      renderWeekLine(cur);
    }

    // ---- English ladder card ----
    function ladderStats(id) {
      try { return JSON.parse(safeStorage().getItem(T.vocabKey(id))) || {}; } catch (e) { return {}; }
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function renderLadderCard(cur) {
      const el = document.getElementById('ladderCard');
      if (!window.Ladder || !Ladder.ladderUnits(manifest).length) { el.classList.add('hidden'); return; }
      const q = `name=${encodeURIComponent(cur.name)}&gender=${cur.gender}`;
      const pos = Ladder.loadPosition(safeStorage(), cur.name);
      el.classList.remove('hidden');
      if (!pos.level && !pos.placedAt) {
        el.innerHTML = `<div class="ladder-kicker">🪜 המסלול שלי באנגלית</div>
          <div class="ladder-title">בואו נמצא את הרמה שלך</div>
          <div class="ladder-sub">מבחן קצר של כ־5 דקות, ומשם ממשיכים יחידה אחרי יחידה</div>
          <div class="ladder-btns"><a class="ladder-btn primary" href="app/ladder.html?placement=1&${q}">למבחן רמה</a></div>
          <a class="ladder-link" href="app/ladder.html?${q}">למסלול המלא</a>`;
        return;
      }
      const st = Ladder.ladderState(manifest, pos, ladderStats);
      // Save a level change, but leave "seen" to the ladder page, so it can still mark new units 🆕
      Ladder.savePosition(safeStorage(), cur.name, Object.assign({}, st.position, { seen: pos.seen }));
      const lvl = st.levels.find(l => l.id === st.currentLevel);
      const u = st.units.find(x => x.id === st.currentUnitId);
      let html = `<div class="ladder-kicker">🪜 המסלול שלי באנגלית</div>
        <div class="ladder-title">רמה <span class="lvl-id">${st.currentLevel}</span> · ${esc(lvl.name)}</div>`;
      if (u) {
        const pct = u.status.total ? Math.round(u.status.known / u.status.total * 100) : 0;
        html += `<div class="ladder-sub">יחידה ${u.unit}: ${esc(u.name)}</div>
          <div class="ladder-bar"><div class="ladder-fill" style="width:${pct}%"></div></div>
          <div class="ladder-sub"><span dir="ltr">${u.status.known}/${u.status.total}</span> ידועים</div>
          <div class="ladder-btns">
            <a class="ladder-btn primary" href="app/vocab.html?topic=${u.id}&${q}">להמשיך</a>
            <a class="ladder-btn" href="app/quiz.html?ladder=review&${q}">חזרה</a>
          </div>`;
      } else {
        html += `<div class="ladder-sub">סיימת את כל היחידות שיש כרגע ברמה הזו — עוד יחידות בדרך!</div>
          <div class="ladder-btns"><a class="ladder-btn primary" href="app/quiz.html?ladder=review&${q}">חזרה</a></div>`;
      }
      if (st.newUnitIds.length) html += `<div class="ladder-note">🆕 נוספו ${st.newUnitIds.length} יחידות חדשות ברמות קודמות</div>`;
      html += `<a class="ladder-link" href="app/ladder.html?${q}">למסלול המלא</a>`;
      el.innerHTML = html;
    }

    // ---- This week's progress toward the goal ----
    function renderWeekLine(cur) {
      const el = document.getElementById('weekLine');
      if (!cur.minutesPerWeek) { el.classList.add('hidden'); return; }
      const draw = (w) => {
        const goal = cur.minutesPerWeek, goalDays = cur.daysPerWeek || 0;
        const met = w.minutes >= goal && (!goalDays || w.days >= goalDays);
        document.getElementById('weekText').innerHTML =
          (met ? '<div class="week-cheer">🎉 עמדת ביעד השבוע!</div>' : '') +
          `<div>השבוע: <span dir="ltr" class="week-num">${w.minutes} / ${goal}</span> דק׳` +
          (goalDays ? ` · ימים: <span dir="ltr" class="week-num">${w.days} / ${goalDays}</span>` : '') + '</div>';
        document.getElementById('weekFill').style.width = Math.min(100, Math.round(w.minutes / goal * 100)) + '%';
        el.classList.toggle('met', met);
        el.classList.remove('hidden');
      };
      const local = T.localWeek(cur.name);
      draw(local);
      T.fetchWeek(cur.name).then(w => {
        const now = T.getCurrent();
        if (!w || !now || now.name !== cur.name) return;
        // the server may not have this device's unsent minutes yet
        draw({ minutes: Math.max(w.minutes, local.minutes), days: Math.max(w.days, local.days) });
      });
    }

    function renderTopicGrid(cur) {
      const grade = cur.grade;
      const progress = pm();
      const grid = document.getElementById('topicsGrid');
      grid.innerHTML = '';

      const gender = cur.gender;
      const nameParam = encodeURIComponent(cur.name);

      let cardIndex = 0;

      // Speed drill card — only for grade 4
      if (grade === 4) {
        const speedCard = document.createElement('a');
        speedCard.className = 'topic-card speed-card animate-in';
        speedCard.style.animationDelay = `${cardIndex * 60}ms`;
        speedCard.href = `app/speed.html?name=${nameParam}&gender=${gender}`;
        speedCard.innerHTML = `
          <div class="icon">⚡</div>
          <div class="name">אלופי הכפל — שלב ראשון</div>
          <div class="stats" style="color:var(--color-warning);">תרגול מהיר עם טיימר</div>
        `;
        grid.appendChild(speedCard);
        cardIndex++;

        const semifinalCard = document.createElement('a');
        semifinalCard.className = 'topic-card animate-in';
        semifinalCard.style.animationDelay = `${cardIndex * 60}ms`;
        semifinalCard.href = `app/speed-semifinal.html?name=${nameParam}&gender=${gender}`;
        semifinalCard.innerHTML = `
          <div class="icon">🏅</div>
          <div class="name">אלופי הכפל — חצי גמר וגמר</div>
          <div class="stats" style="color:#8B5CF6;">תרגול מהיר עם טיימר</div>
        `;
        grid.appendChild(semifinalCard);
        cardIndex++;
      }

      // Regular topic cards
      manifest.topics
        .filter(topic => topic.grade === grade)
        .sort((a, b) => (a.order || 0) - (b.order || 0))
        .forEach(topic => {
          const p = progress.getTopicProgress(topic.id);
          const pct = p.total > 0 ? Math.round((p.correct / p.total) * 100) : 0;

          const card = document.createElement('a');
          card.className = 'topic-card animate-in';
          card.style.animationDelay = `${cardIndex * 60}ms`;
          const page = topic.type === 'vocab' ? 'vocab' : 'quiz';
          card.href = `app/${page}.html?topic=${topic.id}&name=${nameParam}&gender=${gender}`;

          card.innerHTML = `
            <div class="icon">${topic.icon || '📝'}</div>
            <div class="name">${topic.name}</div>
            ${p.total > 0 ? `
              <div class="progress-bar">
                <div class="progress-fill" style="width:${pct}%"></div>
              </div>
              <div class="stats">${p.correct}/${p.total} (${pct}%)</div>
            ` : `
              <div class="stats">טרם תורגל</div>
            `}
          `;

          grid.appendChild(card);
          cardIndex++;
        });
    }

    function updateTotalStats() {
      const allProgress = pm().getAllProgress();
      let totalCorrect = 0;
      Object.values(allProgress).forEach(p => {
        totalCorrect += (p.correct || 0);
      });
      document.getElementById('totalCorrect').textContent = totalCorrect;
    }

    function hideAll() {
      ['bootScreen', 'nameScreen', 'gradeScreen', 'genderScreen', 'topicsScreen', 'learnerScreen', 'mapScreen'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }

    // ---- Boot ----
    init();
  </script>
</body>
</html>
