<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגול מתמטיקה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="quiz-container" id="quizContainer">
    <!-- Top bar -->
    <div class="quiz-top-bar">
      <a href="../index.html" class="back-btn" id="backBtn" title="חזרה לתפריט">חזרה ←</a>
      <div class="quiz-topic-title" id="topicTitle"></div>
      <div class="streak-badge" id="streakBadge">🔥 <span id="streakCount">0</span></div>
    </div>
    
    <!-- Question navigation dots -->
    <div class="question-dots" id="questionDots"></div>
    
    <!-- Question card -->
    <div class="question-card" id="questionCard">
      <div class="question-number" id="questionNumber"></div>
      <div class="question-text" id="questionText"></div>
      <div class="visual-container" id="visualContainer"></div>
      
      <!-- Multiple choice options -->
      <div class="options-grid" id="optionsGrid"></div>
      
      <!-- Free input -->
      <div class="free-input-group hidden" id="freeInputGroup">
        <input type="text" class="answer-input" id="answerInput" 
               placeholder="הקלידו תשובה" autocomplete="off" dir="ltr">
        <button class="submit-btn" id="submitBtn">בדיקה</button>
      </div>
      
      <!-- Feedback -->
      <div class="feedback" id="feedback">
        <div class="congrats" id="feedbackTitle"></div>
        <div class="explanation" id="feedbackExplanation"></div>
      </div>
    </div>
    
    <!-- Bottom navigation -->
    <div class="quiz-nav">
      <button class="nav-btn" id="prevBtn" onclick="goToQuestion(state.currentQ - 1)">→ הקודמת</button>
      <button class="flag-btn" id="flagBtn" onclick="toggleFlag()">🚩</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextQuestion()">הבאה ←</button>
    </div>
  </div>
  
  <!-- Loading state -->
  <div id="loadingScreen" class="landing-container">
    <div style="text-align:center;">
      <div style="font-size:2em;margin-bottom:16px;">⏳</div>
      <div>טוען שאלות...</div>
    </div>
  </div>
  
  <!-- Error state -->
  <div id="errorScreen" class="landing-container hidden">
    <div style="text-align:center;">
      <div style="font-size:2em;margin-bottom:16px;">😕</div>
      <div id="errorMessage">שגיאה בטעינת השאלות</div>
      <a href="../index.html" class="start-btn" style="display:inline-block;margin-top:16px;text-decoration:none;">חזרה לתפריט</a>
    </div>
  </div>
  
  <script src="core.js?v=20261126b"></script>
  <script src="tracker.js?v=20261126b"></script>
  <script src="vocab.js?v=20261126b"></script>
  <script src="ladder.js?v=20261126b"></script>
  <script>
    // ============================================
    // STATE
    // ============================================
    
    const params = new URLSearchParams(window.location.search);
    const isReview = params.get('ladder') === 'review';   // English ladder: review across units
    const topicId = isReview ? 'ladder-review' : params.get('topic');
    const userName = decodeURIComponent(params.get('name') || '');
    const userGender = (params.get('gender') || storedGender()) === 'male' ? 'male' : 'female';
    
    const progress = new ProgressManager(Tracker.progressPrefix());
    Tracker.setPage({ topic: topicId || '', mode: params.get('mode') || '', level: params.get('level') || '' });
    Tracker.attach();
    
    const state = {
      questions: [],
      currentQ: 0,
      answers: {},     // { questionIndex: { answered: true, correct: bool, selected: value } }
      streak: 0,
      topicMeta: null,
    };
    
    
    // ============================================
    // INITIALIZATION
    // ============================================
    
    async function init() {
      if (isReview) return initReview();
      if (!topicId) {
        showError('לא צוין נושא');
        return;
      }
      
      try {
        // Load topic content
        const content = localizeVocabContent(await loadContent(`../content/${topicId}.json`), userGender);
        if (content && content.type === 'vocab') {
          // Vocab topic: questions are generated from the word/sentence lists (vocab.js)
          state.isVocab = true;
          state.vocabMode = params.get('mode') || 'mix';
          const n = params.has('n') ? parseInt(params.get('n')) || 0 : (content.questionsPerSession || 20);
          content.questions = buildVocabQuestions(content, state.vocabMode, n, topicId, params.get('level'));
          content.shuffle = false;
          content.questionsPerSession = 0;
        }
        if (!content || !content.questions || content.questions.length === 0) {
          // Try generated questions if the JSON has a generator config
          showError('לא נמצאו שאלות לנושא זה');
          return;
        }
        
        state.topicMeta = content;
        state.questions = prepareQuestions(content);
        Tracker.setPage({
          topic: topicId,
          level: state.isVocab ? (params.get('level') || vocabLevels(content)[0]) : '',
          mode: state.isVocab ? state.vocabMode : (params.get('mode') || ''),
        });
        Tracker.session();
        
        document.getElementById('topicTitle').textContent = content.name || topicId;
        document.title = `תרגול: ${content.name || topicId}`;
        
        if (state.isVocab) {
          const mode = VOCAB_MODES[state.vocabMode] || VOCAB_MODES.mix;
          document.getElementById('topicTitle').textContent = `${content.name} — ${mode.label}`;
          document.getElementById('backBtn').href =
            `vocab.html?topic=${encodeURIComponent(topicId)}&name=${encodeURIComponent(userName)}&gender=${userGender}` +
            (params.get('level') ? `&level=${params.get('level')}` : '');
          document.getElementById('flagBtn').classList.add('hidden');
          const input = document.getElementById('answerInput');
          input.placeholder = 'הקלידו באנגלית';
          input.setAttribute('lang', 'en');
          input.setAttribute('autocapitalize', 'off');
          input.setAttribute('autocorrect', 'off');
          input.setAttribute('spellcheck', 'false');
        }
        
        // Load saved progress for streak
        const savedProgress = progress.getTopicProgress(topicId);
        state.streak = savedProgress.streak || 0;
        
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('quizContainer').classList.remove('hidden');
        
        renderDots();
        showQuestion(0);
        
      } catch (e) {
        console.error('Failed to load topic:', e);
        showError('שגיאה בטעינת הנושא: ' + topicId);
      }
    }
    
    // ---- Ladder review: practiced items from finished units, needs-work and longest-unseen first ----
    async function initReview() {
      const ladderHref = `ladder.html?name=${encodeURIComponent(userName)}&gender=${userGender}`;
      document.getElementById('backBtn').href = ladderHref;
      document.querySelector('#errorScreen a').href = ladderHref;
      document.querySelector('#errorScreen a').textContent = 'למסלול';
      try {
        const cur = Tracker.getCurrent();
        const manifest = await loadManifest('../content/manifest.json');
        if (!cur || !manifest) return showError('שגיאה בטעינת החזרה');
        const st = Ladder.ladderState(manifest, Ladder.loadPosition(safeStorage(), cur.name), id => VocabStats.get(id));
        const ids = Ladder.reviewUnitIds(st).filter(id => Object.keys(VocabStats.get(id)).length);
        const contents = {};
        await Promise.all(ids.map(async id => {
          const c = await loadContent(`../content/${id}.json`);
          if (c) contents[id] = localizeVocabContent(c, userGender);
        }));
        const units = ids.filter(id => contents[id]).map(id => ({ id, items: (contents[id].words || []).concat(contents[id].sentences || []) }));
        const picks = Ladder.reviewPick(units, id => VocabStats.get(id), 20);
        if (!picks.length) return showError('עוד אין מה לחזור עליו — החזרה היא על יחידות שסיימת. סיימו יחידה ותחזרו לכאן');
        state.isVocab = true;
        state.vocabMode = 'mix';
        const content = { name: 'חזרה — המסלול שלי', questions: buildReviewQuestions(picks.map(p => Object.assign({ unitContent: contents[p.unitId] }, p))), shuffle: false, questionsPerSession: 0 };
        state.topicMeta = content;
        state.questions = prepareQuestions(content);
        Tracker.setPage({ topic: 'ladder-review', mode: 'review' });
        Tracker.session();
        document.getElementById('topicTitle').textContent = '🪜 ' + content.name;
        document.title = content.name;
        document.getElementById('flagBtn').classList.add('hidden');
        const input = document.getElementById('answerInput');
        input.placeholder = 'הקלידו באנגלית';
        input.setAttribute('lang', 'en');
        input.setAttribute('autocapitalize', 'off');
        input.setAttribute('autocorrect', 'off');
        input.setAttribute('spellcheck', 'false');
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('quizContainer').classList.remove('hidden');
        renderDots();
        showQuestion(0);
      } catch (e) {
        console.error('Failed to build review:', e);
        showError('שגיאה בטעינת החזרה');
      }
    }

    function showError(msg) {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('errorScreen').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = msg;
    }
    
    /**
     * Prepare questions from content JSON.
     * Shuffles if content.shuffle is true.
     * Limits to content.questionsPerSession if set.
     */
    function prepareQuestions(content) {
      let questions = [...content.questions];
      
      if (content.shuffle !== false) {
        shuffle(questions);
      }
      
      if (content.questionsPerSession && content.questionsPerSession < questions.length) {
        questions = questions.slice(0, content.questionsPerSession);
      }
      
      return questions;
    }
    
    
    // ============================================
    // QUESTION RENDERING
    // ============================================
    
    function showQuestion(index) {
      if (index < 0 || index >= state.questions.length) return;
      
      state.currentQ = index;
      const q = state.questions[index];
      const answered = state.answers[index];
      
      // Update question number
      document.getElementById('questionNumber').textContent = 
        `שאלה ${index + 1} מתוך ${state.questions.length}`;
      
      // Render question text with bidi fix
      if (q.vocab) {
        if (!answered && q.kind !== 'listen' && _vocabAudio) { _vocabAudio.pause(); }
        renderVocabPrompt(document.getElementById('questionText'), q, !!answered);
        if (q.kind === 'listen' && !answered) setTimeout(() => playEnglish(q.word.en), 300);
      } else {
        setMixedText(document.getElementById('questionText'), q.text);
      }
      
      // Render visual if present
      const visualContainer = document.getElementById('visualContainer');
      visualContainer.style.display = 'none';
      visualContainer.innerHTML = '';
      if (q.visual) {
        renderVisual(visualContainer, q.visual);
      }
      
      // Render answer input based on question type
      const optionsGrid = document.getElementById('optionsGrid');
      const freeInputGroup = document.getElementById('freeInputGroup');
      
      if (q.type === 'free-input') {
        optionsGrid.innerHTML = '';
        optionsGrid.classList.add('hidden');
        freeInputGroup.classList.remove('hidden');
        
        const input = document.getElementById('answerInput');
        const submitBtn = document.getElementById('submitBtn');
        
        if (answered) {
          input.value = answered.selected;
          input.disabled = true;
          submitBtn.disabled = true;
          submitBtn.style.opacity = '0.5';
        } else {
          input.value = '';
          input.disabled = false;
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
          
          // Remove old listeners by replacing elements
          const newInput = input.cloneNode(true);
          input.parentNode.replaceChild(newInput, input);
          const newSubmit = submitBtn.cloneNode(true);
          submitBtn.parentNode.replaceChild(newSubmit, submitBtn);
          
          newInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkFreeInput();
          });
          newSubmit.addEventListener('click', checkFreeInput);
          
          setTimeout(() => newInput.focus(), 100);
        }
        
      } else if (q.type === 'order' || q.type === 'speak') {
        // Vocab: build-the-sentence tiles / say it aloud (vocab.js)
        freeInputGroup.classList.add('hidden');
        optionsGrid.classList.remove('hidden');
        const render = q.type === 'order' ? renderOrderQuestion : renderSpeakQuestion;
        render(optionsGrid, q, answered, (isCorrect, selected) => {
          state.answers[state.currentQ] = { answered: true, correct: isCorrect, selected };
          recordResult(isCorrect);
          render(optionsGrid, q, state.answers[state.currentQ]);
          showFeedback(isCorrect, q);
          if (isCorrect) playEnglish(q.word.en);
        });
      } else {
        // Multiple choice (default)
        freeInputGroup.classList.add('hidden');
        optionsGrid.classList.remove('hidden');
        optionsGrid.innerHTML = '';
        
        q.options.forEach((opt, oi) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          if (q.vocab) {
            btn.textContent = String(opt);
            if (q.optionsLang === 'en') { btn.classList.add('opt-en'); btn.dir = 'ltr'; btn.lang = 'en'; }
          } else {
            btn.innerHTML = fixBidi(String(opt));
          }
          
          if (answered) {
            btn.classList.add('disabled');
            if (oi === q.correct) btn.classList.add('correct');
            if (oi === answered.selected && !answered.correct) btn.classList.add('wrong');
          } else {
            btn.addEventListener('click', () => checkOption(oi));
          }
          
          optionsGrid.appendChild(btn);
        });
      }
      
      // Show/hide feedback
      const feedback = document.getElementById('feedback');
      if (answered) {
        showFeedback(answered.correct, q);
      } else {
        feedback.classList.remove('show');
      }
      
      // Update dots
      updateDots();
      
      // Update nav buttons
      document.getElementById('prevBtn').disabled = index === 0;
      
      // Update flag button
      const savedProgress = progress.getTopicProgress(topicId);
      const flagBtn = document.getElementById('flagBtn');
      flagBtn.classList.toggle('flagged', (savedProgress.flagged || []).includes(index));
      
      // Update streak badge
      updateStreakBadge();
    }
    
    
    // ============================================
    // ANSWER CHECKING
    // ============================================
    
    function checkOption(selectedIndex) {
      const q = state.questions[state.currentQ];
      const isCorrect = selectedIndex === q.correct;
      
      state.answers[state.currentQ] = {
        answered: true,
        correct: isCorrect,
        selected: selectedIndex,
      };
      
      recordResult(isCorrect);
      if (q.vocab && (q.kind === 'listen' || q.kind === 'cloze')) renderVocabPrompt(document.getElementById('questionText'), q, true);
      
      // Update option buttons
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, i) => {
        btn.classList.add('disabled');
        if (i === q.correct) btn.classList.add('correct');
        if (i === selectedIndex && !isCorrect) btn.classList.add('wrong');
      });
      
      showFeedback(isCorrect, q);
    }
    
    function checkFreeInput() {
      const input = document.getElementById('answerInput');
      const value = input.value.trim();
      if (!value) return;
      
      const q = state.questions[state.currentQ];
      
      // Normalize answer comparison
      const norm = q.vocab ? vocabNormalize : normalizeAnswer;
      const userAnswer = norm(value);
      const correctAnswers = Array.isArray(q.correct) ? q.correct : [q.correct];
      const isCorrect = correctAnswers.some(ca => norm(String(ca)) === userAnswer);
      
      state.answers[state.currentQ] = {
        answered: true,
        correct: isCorrect,
        selected: value,
      };
      
      recordResult(isCorrect);
      
      input.disabled = true;
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').style.opacity = '0.5';
      
      showFeedback(isCorrect, q);
    }
    
    /**
     * Normalize an answer string for comparison.
     * Handles: spaces, Hebrew, fractions, decimals.
     */
    function normalizeAnswer(str) {
      return str
        .replace(/\s+/g, '')
        .replace(/،/g, ',')
        .replace(/٫/g, '.')
        .toLowerCase()
        .trim();
    }
    
    function recordResult(isCorrect) {
      if (isCorrect) {
        state.streak++;
        launchConfetti(state.streak >= 5 ? 50 : 30);
      } else {
        state.streak = 0;
      }
      
      const q = state.questions[state.currentQ];
      progress.recordAnswer(q.topicId || topicId, isCorrect);
      if (q.vocab) VocabStats.record(q.topicId || topicId, q.word.en, isCorrect);
      const given = (state.answers[state.currentQ] || {}).selected;
      Tracker.answer({
        kind: q.vocab ? q.kind : q.type,
        item: q.vocab ? q.word.en : String(q.text || '').slice(0, 60),
        correct: isCorrect,
        given: q.vocab && q.kind === 'write' ? given : '',
      });
      updateStreakBadge();
      updateDots();
    }
    
    
    // ============================================
    // FEEDBACK DISPLAY
    // ============================================
    
    function showFeedback(isCorrect, question) {
      const feedback = document.getElementById('feedback');
      const title = document.getElementById('feedbackTitle');
      const explanation = document.getElementById('feedbackExplanation');
      
      feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
      
      if (isCorrect) {
        title.textContent = getCongratsMessage(userName, state.streak, userGender);
        explanation.innerHTML = '';
        // Spelling tip: months, names and "I" start with a capital letter
        const a = state.answers[state.currentQ];
        if (question.vocab && question.kind === 'write' && a && /^[A-Z]/.test(question.word.en) && !/^[A-Z]/.test(a.selected)) {
          explanation.innerHTML = `💡 שימו לב: באנגלית כותבים באות גדולה — <strong dir="ltr" style="unicode-bidi:isolate">${escapeHtml(question.word.en)}</strong>`;
        }
      } else if (question.vocab) {
        title.textContent = 'לא נכון, אבל אפשר ללמוד מזה!';
        explanation.innerHTML = vocabPairHtml(question.word, 'vocab-answer');
      } else {
        title.textContent = 'לא נכון, אבל אפשר ללמוד מזה!';
        
        let explanationHtml = '';
        
        // Show correct answer
        if (question.type === 'free-input') {
          const correctVal = Array.isArray(question.correct) ? question.correct[0] : question.correct;
          explanationHtml += `<div style="margin-bottom:8px;">התשובה הנכונה: <strong dir="ltr" style="unicode-bidi:isolate">${correctVal}</strong></div>`;
        }
        
        // Show explanation if available
        if (question.explanation) {
          explanationHtml += `<div>${fixBidi(question.explanation)}</div>`;
        }
        
        explanation.innerHTML = explanationHtml;
      }
    }
    
    
    // ============================================
    // NAVIGATION
    // ============================================
    
    function nextQuestion() {
      // Find next unanswered question, or go to next
      let next = state.currentQ + 1;
      
      // If at the end, try to find unanswered questions
      if (next >= state.questions.length) {
        const unanswered = [];
        for (let i = 0; i < state.questions.length; i++) {
          if (!state.answers[i]) unanswered.push(i);
        }
        if (unanswered.length > 0) {
          next = unanswered[0];
        } else {
          // All done — show summary
          showSummary();
          return;
        }
      }
      
      showQuestion(next);
    }
    
    function goToQuestion(index) {
      if (index >= 0 && index < state.questions.length) {
        showQuestion(index);
      }
    }
    
    function toggleFlag() {
      const savedProgress = progress.getTopicProgress(topicId);
      const flagged = savedProgress.flagged || [];
      
      if (flagged.includes(state.currentQ)) {
        progress.unflagQuestion(topicId, state.currentQ);
      } else {
        progress.flagQuestion(topicId, state.currentQ);
      }
      
      document.getElementById('flagBtn').classList.toggle('flagged');
      updateDots();
    }
    
    
    // ============================================
    // UI UPDATES
    // ============================================
    
    function renderDots() {
      const container = document.getElementById('questionDots');
      container.innerHTML = '';
      
      state.questions.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'q-dot';
        dot.textContent = i + 1;
        dot.addEventListener('click', () => goToQuestion(i));
        container.appendChild(dot);
      });
    }
    
    function updateDots() {
      const dots = document.querySelectorAll('.q-dot');
      const savedProgress = progress.getTopicProgress(topicId);
      const flagged = savedProgress.flagged || [];
      
      dots.forEach((dot, i) => {
        dot.className = 'q-dot';
        
        if (i === state.currentQ) dot.classList.add('current');
        
        if (state.answers[i]) {
          dot.classList.add(state.answers[i].correct ? 'correct' : 'wrong');
        }
        
        if (flagged.includes(i)) dot.classList.add('flagged');
      });
    }
    
    function updateStreakBadge() {
      const badge = document.getElementById('streakBadge');
      const count = document.getElementById('streakCount');
      
      if (state.streak >= 3) {
        badge.classList.add('active');
        count.textContent = state.streak;
      } else {
        badge.classList.remove('active');
      }
    }
    
    function showSummary() {
      const total = state.questions.length;
      const correct = Object.values(state.answers).filter(a => a.correct).length;
      const pct = Math.round((correct / total) * 100);
      
      const card = document.getElementById('questionCard');
      card.innerHTML = `
        <div style="text-align:center;padding:20px;">
          <div style="font-size:3em;margin-bottom:16px;">${pct >= 80 ? '🏆' : pct >= 60 ? '⭐' : '💪'}</div>
          <h2>סיימת את התרגול!</h2>
          <div style="font-size:1.3em;margin:16px 0;">
            ${correct} מתוך ${total} נכונות (${pct}%)
          </div>
          ${state.isVocab ? vocabSummaryHtml() : ''}
          <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            <button class="nav-btn primary" onclick="location.reload()">תרגול נוסף</button>
            <a href="../index.html" class="nav-btn" style="text-decoration:none;display:inline-block;">חזרה לתפריט</a>
          </div>
        </div>
      `;
      
      document.getElementById('questionDots').innerHTML = '';
      document.querySelector('.quiz-nav').classList.add('hidden');
      
      if (pct >= 80) launchConfetti(80);
    }
    
    
    /** English on its own LTR line, Hebrew below — never mixed on one line (BiDi). */
    function vocabPairHtml(item, cls) {
      return `<div class="${cls}"><div class="pair-en" dir="ltr" lang="en">${escapeHtml(item.en)}</div>` +
             `<div class="pair-he" dir="rtl">${escapeHtml(item.he)}</div></div>`;
    }
    
    function vocabSummaryHtml() {
      const missed = [];
      state.questions.forEach((q, i) => {
        const a = state.answers[i];
        if (a && !a.correct && !missed.includes(q.word)) missed.push(q.word);
      });
      if (!missed.length) return '';
      return `<div class="vocab-missed">
        <div style="font-weight:600;margin-bottom:8px;">כדאי לחזור על:</div>
        ${missed.map(w => vocabPairHtml(w, 'missed-item')).join('')}
      </div>`;
    }
    
    
    // ============================================
    // BOOT
    // ============================================
    
    // Hide quiz container until loaded
    document.getElementById('quizContainer').classList.add('hidden');
    init();
  </script>
</body>
</html>
