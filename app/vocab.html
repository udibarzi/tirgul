<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגול אנגלית</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Menu: pick a practice mode -->
  <div id="menuScreen" class="topics-container hidden">
    <div class="quiz-top-bar">
      <a href="../index.html" class="back-btn" id="menuBack">חזרה ←</a>
      <div class="quiz-topic-title" id="menuTitle"></div>
      <div></div>
    </div>

    <div class="level-tabs hidden" id="levelTabs"></div>

    <div class="vocab-summary" id="menuSummary"></div>

    <div class="count-row">
      <span>כמה שאלות?</span>
      <button class="count-chip" data-n="10">10</button>
      <button class="count-chip" data-n="20">20</button>
      <button class="count-chip" data-n="0" id="allChip">הכול</button>
    </div>

    <div class="topics-grid" id="modesGrid"></div>
  </div>

  <!-- Flashcards -->
  <div id="cardsScreen" class="quiz-container hidden">
    <div class="quiz-top-bar">
      <a class="back-btn" href="#" id="cardsBack">חזרה ←</a>
      <div class="quiz-topic-title">כרטיסיות</div>
      <div class="cards-counter" id="cardsCounter"></div>
    </div>

    <div class="count-row">
      <span>מתחילים מ:</span>
      <button class="count-chip" data-side="en">אנגלית</button>
      <button class="count-chip" data-side="he">עברית</button>
      <button class="count-chip" data-side="audio">🎧 שמיעה</button>
    </div>

    <div class="flashcard" id="flashcard">
      <div class="flashcard-front" id="cardFront"></div>
      <div class="flashcard-back hidden" id="cardBack"></div>
      <div class="flashcard-tap" id="cardTap">לחצו על הכרטיס כדי להפוך</div>
    </div>

    <div class="quiz-nav" id="cardButtons">
      <button class="nav-btn" id="cardNo">✗ עוד לא</button>
      <button class="nav-btn primary" id="cardYes">✓ ידעתי</button>
    </div>
  </div>

  <!-- Word list -->
  <div id="listScreen" class="quiz-container hidden">
    <div class="quiz-top-bar">
      <a class="back-btn" href="#" id="listBack">חזרה ←</a>
      <div class="quiz-topic-title" id="listTitle">רשימת המילים</div>
      <div></div>
    </div>
    <div class="question-card">
      <table class="word-table" id="wordTable"></table>
    </div>
  </div>

  <div id="loadingScreen" class="landing-container">
    <div style="text-align:center;"><div style="font-size:2em;margin-bottom:16px;">⏳</div><div>טוען...</div></div>
  </div>

  <script src="core.js"></script>
  <script src="tracker.js"></script>
  <script src="vocab.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const topicId = params.get('topic');
    const userName = params.get('name') || '';
    const userGender = params.get('gender') || localStorage.getItem('math_app_gender') || 'female';
    let content = null;
    let level = 'words';

    function isLadder() { return !!(content && content.ladder); }
    function getPref(k, d) { try { return localStorage.getItem('tirgul_vocab_pref_' + k) || d; } catch (e) { return d; } }
    function setPref(k, v) { try { localStorage.setItem('tirgul_vocab_pref_' + k, v); } catch (e) {} }

    function show(id) {
      ['menuScreen', 'cardsScreen', 'listScreen', 'loadingScreen'].forEach(s =>
        document.getElementById(s).classList.toggle('hidden', s !== id));
      window.scrollTo(0, 0);
    }

    Tracker.setPage({ topic: 'menu' });
    Tracker.attach();

    async function init() {
      content = topicId ? localizeVocabContent(await loadContent(`../content/${topicId}.json`), userGender) : null;
      if (!content || content.type !== 'vocab' || !vocabLevels(content).length) {
        document.getElementById('loadingScreen').innerHTML =
          '<div style="text-align:center;">😕 לא נמצאה רשימת מילים<br><a href="../index.html">חזרה לתפריט</a></div>';
        return;
      }
      document.title = content.name;
      document.getElementById('menuTitle').textContent = content.name;
      if (isLadder()) {
        // English ladder unit: back to the path; start on sentences, Hebrew side first (say it in English)
        document.getElementById('menuBack').href = `ladder.html?name=${encodeURIComponent(userName)}&gender=${userGender}`;
        document.getElementById('menuTitle').textContent = `${content.ladder.level} · יחידה ${content.ladder.unit} — ${content.name}`;
        document.getElementById('menuTitle').dir = 'rtl';
      }
      document.getElementById('cardsBack').onclick = (e) => { e.preventDefault(); showMenu(); };
      document.getElementById('listBack').onclick = (e) => { e.preventDefault(); showMenu(); };
      const levels = vocabLevels(content);
      const wanted = params.get('level') || getPref('level_' + topicId, isLadder() && levels.includes('sentences') ? 'sentences' : levels[0]);
      level = levels.includes(wanted) ? wanted : levels[0];
      showMenu();
    }

    // ---------------- Menu ----------------
    function showMenu() {
      show('menuScreen');
      Tracker.setPage({ topic: 'menu' });
      const words = vocabItems(content, level);
      const isSent = level === 'sentences';
      const unit = isSent ? 'משפטים' : 'מילים';
      const stats = VocabStats.get(topicId);
      const seen = words.filter(w => stats[w.en]).length;
      const known = words.filter(w => stats[w.en] && !VocabStats.needsWork(stats[w.en])).length;
      const hard = VocabStats.hardWords(topicId, words);

      // Words / sentences tabs (only when the topic has both)
      const levels = vocabLevels(content);
      const tabs = document.getElementById('levelTabs');
      tabs.classList.toggle('hidden', levels.length < 2);
      tabs.innerHTML = levels.map(l =>
        `<button class="level-tab${l === level ? ' active' : ''}" data-level="${l}">` +
        `${l === 'words' ? '🔤' : '💬'} ${VOCAB_LEVEL_NAMES[l]}</button>`).join('');
      tabs.querySelectorAll('.level-tab').forEach(b => b.onclick = () => {
        level = b.dataset.level; setPref('level_' + topicId, level); showMenu();
      });

      document.getElementById('menuSummary').innerHTML =
        `<div><strong>${words.length}</strong> ${unit} ברשימה</div>` +
        (seen ? `<div>✅ ${known} יודעים · 💪 ${hard.length} לחיזוק · 🆕 ${words.length - seen} עוד לא תורגלו</div>` : '') +
        (isLadder() ? ladderUnitLine(stats) : '');

      // Question-count chips
      const n = getPref('n', String(content.questionsPerSession || 20));
      document.querySelectorAll('#menuScreen .count-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.n === n);
        chip.onclick = () => { setPref('n', chip.dataset.n); showMenu(); };
      });

      const quizUrl = (mode) =>
        `quiz.html?topic=${encodeURIComponent(topicId)}&mode=${mode}&n=${n}&level=${level}` +
        `&name=${encodeURIComponent(userName)}&gender=${userGender}`;

      const kinds = vocabKinds(content, level);
      const kindCards = {
        'en-he':  { sub: 'רואים באנגלית — בוחרים פירוש' },
        'he-en':  { sub: 'רואים בעברית — בוחרים באנגלית' },
        'write':  { sub: 'רואים בעברית — כותבים באנגלית' },
        'listen': { sub: 'שומעים באנגלית — בוחרים פירוש' },
        'order':  { sub: 'מסדרים את המילים למשפט נכון' },
        'cloze':  { sub: 'בוחרים את המילה שחסרה במשפט' },
        'speak':  { sub: 'רואים בעברית — אומרים באנגלית. ניסיוני' },
      };
      const cards = [{ icon: '📇', name: 'כרטיסיות', sub: `לומדים את ה${unit}`, onclick: startCards }];
      kinds.forEach(k => cards.push({ icon: VOCAB_MODES[k].icon, name: VOCAB_MODES[k].label, sub: kindCards[k].sub, href: quizUrl(k) }));
      cards.push({ icon: '🎯', name: VOCAB_MODES['mix'].label, sub: 'הכול ביחד — כמו במבחן', href: quizUrl('mix') });
      if (hard.length) {
        cards.push({ icon: '💪', name: `${unit} ${VOCAB_MODES['hard'].label}`, sub: `${hard.length} ${unit} שעוד מתבלבלים בהם`, href: quizUrl('hard') });
      }
      cards.push({ icon: '📋', name: `רשימת ה${unit}`, sub: `כל ה${unit} והפירושים`, onclick: showList });

      const grid = document.getElementById('modesGrid');
      grid.innerHTML = '';
      cards.forEach((c, i) => {
        const el = document.createElement('a');
        el.className = 'topic-card animate-in';
        el.style.animationDelay = `${i * 50}ms`;
        if (c.href) el.href = c.href;
        else { el.href = '#'; el.onclick = (e) => { e.preventDefault(); c.onclick(); }; }
        el.innerHTML = `<div class="icon">${c.icon}</div><div class="name">${c.name}</div><div class="stats">${c.sub}</div>`;
        grid.appendChild(el);
      });
    }

    /** Unit progress toward opening the next unit: 80% of all its items known (see ladder.js). */
    function ladderUnitLine(stats) {
      const all = (content.words || []).concat(content.sentences || []);
      const known = all.filter(w => stats[w.en] && !VocabStats.needsWork(stats[w.en])).length;
      const need = Math.ceil(all.length * 0.8);
      return known >= need
        ? `<div>🪜 היחידה הושלמה — <span dir="ltr">${known}/${all.length}</span> ידועים. היחידה הבאה פתוחה!</div>`
        : `<div>🪜 ביחידה: <span dir="ltr">${known}/${all.length}</span> ידועים — עוד ${need - known} כדי לפתוח את היחידה הבאה</div>`;
    }

    // ---------------- Flashcards ----------------
    const cards = { deck: [], i: 0, flipped: false, yes: 0, missed: [] };

    function startCards(deck) {
      cards.deck = shuffle([...(Array.isArray(deck) ? deck : vocabItems(content, level))]);
      cards.i = 0; cards.yes = 0; cards.missed = [];
      cards.deckId = (cards.deckId || 0) + 1; cards.busy = false;
      document.getElementById('flashcard').classList.remove('knew', 'notyet');
      document.getElementById('cardYes').disabled = false;
      document.getElementById('cardNo').disabled = false;
      show('cardsScreen');
      Tracker.setPage({ topic: topicId, level, mode: 'cards' });
      Tracker.session();
      document.querySelectorAll('#cardsScreen .count-chip').forEach(chip => {
        chip.onclick = () => { setPref('side', chip.dataset.side); renderCard(); };
      });
      document.getElementById('flashcard').onclick = flipCard;
      document.getElementById('cardYes').onclick = () => answerCard(true);
      document.getElementById('cardNo').onclick = () => answerCard(false);
      renderCard();
    }

    function sideHtml(word, lang) {
      if (lang === 'audio') {
        return `<div class="listen-wrap"><button type="button" class="listen-btn speak-btn" title="השמעה">🔊</button></div>`;
      }
      if (lang === 'en') {
        return `<div class="vocab-word${vocabSizeClass(word.en)}" dir="ltr" lang="en">${escapeHtml(word.en)} ` +
               `<button type="button" class="speak-btn" title="השמעה">🔊</button></div>`;
      }
      return `<div class="vocab-word${vocabSizeClass(word.he)}" dir="rtl">${escapeHtml(word.he)}</div>`;
    }

    function renderCard() {
      const side = getPref('side', isLadder() ? 'he' : 'en');
      document.querySelectorAll('#cardsScreen .count-chip').forEach(chip =>
        chip.classList.toggle('active', chip.dataset.side === side));

      document.getElementById('cardButtons').classList.remove('hidden');
      document.getElementById('cardTap').classList.remove('hidden');
      const word = cards.deck[cards.i];
      cards.flipped = false;
      document.getElementById('cardsCounter').textContent = `${cards.i + 1} / ${cards.deck.length}`;
      document.getElementById('cardFront').innerHTML = sideHtml(word, side);
      document.getElementById('cardBack').innerHTML = side === 'audio'
        ? sideHtml(word, 'en') + sideHtml(word, 'he')
        : sideHtml(word, side === 'en' ? 'he' : 'en');
      document.getElementById('cardBack').classList.add('hidden');
      document.querySelectorAll('#flashcard .speak-btn').forEach(b =>
        b.onclick = (e) => { e.stopPropagation(); playEnglish(word.en); });
      // Hear the English as soon as it's on screen
      if (side !== 'he') playEnglish(word.en);
    }

    function flipCard() {
      if (cards.i >= cards.deck.length || cards.busy) return;
      cards.flipped = !cards.flipped;
      document.getElementById('cardBack').classList.toggle('hidden', !cards.flipped);
      if (cards.flipped && getPref('side', isLadder() ? 'he' : 'en') === 'he') playEnglish(cards.deck[cards.i].en);
      document.getElementById('cardTap').classList.toggle('hidden', cards.flipped);
    }

    function answerCard(knew) {
      if (cards.busy) return;
      const word = cards.deck[cards.i];
      VocabStats.record(topicId, word.en, knew);
      Tracker.card({ item: word.en, correct: knew });
      if (knew) cards.yes++; else cards.missed.push(word);
      if (cards.flipped) { nextCard(); return; }
      // Not flipped yet: show the answer for a moment, then move on
      cards.busy = true;
      document.getElementById('flashcard').classList.add(knew ? 'knew' : 'notyet');
      document.getElementById('cardYes').disabled = true;
      document.getElementById('cardNo').disabled = true;
      cards.flipped = true;
      document.getElementById('cardBack').classList.remove('hidden');
      document.getElementById('cardTap').classList.add('hidden');
      if (getPref('side', isLadder() ? 'he' : 'en') === 'he') playEnglish(word.en);
      const deckId = cards.deckId;
      setTimeout(() => { if (cards.deckId === deckId) { cards.busy = false; nextCard(); } }, knew ? 1500 : 2500);
    }

    function nextCard() {
      const fc = document.getElementById('flashcard');
      fc.classList.remove('knew', 'notyet');
      document.getElementById('cardYes').disabled = false;
      document.getElementById('cardNo').disabled = false;
      cards.i++;
      if (cards.i < cards.deck.length) { renderCard(); return; }

      // Deck finished
      const total = cards.deck.length;
      document.getElementById('cardsCounter').textContent = '';
      document.getElementById('cardButtons').classList.add('hidden');
      document.getElementById('cardTap').classList.add('hidden');
      document.getElementById('cardBack').classList.add('hidden');
      document.getElementById('cardFront').innerHTML = `
        <div style="font-size:2.5em;">${cards.missed.length === 0 ? '🏆' : '⭐'}</div>
        <div style="font-size:1.2em;margin:12px 0;">ידעת ${cards.yes} מתוך ${total}</div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          ${cards.missed.length ? `<button class="nav-btn primary" id="againMissed">חזרה על ${cards.missed.length} שלא ידעת</button>` : ''}
          <button class="nav-btn" id="againAll">שוב מההתחלה</button>
        </div>`;
      const missed = cards.missed.slice();
      const am = document.getElementById('againMissed');
      if (am) am.onclick = (e) => { e.stopPropagation(); startCards(missed); };
      document.getElementById('againAll').onclick = (e) => { e.stopPropagation(); startCards(); };
      if (cards.missed.length === 0) launchConfetti(60);
    }

    // ---------------- Word list ----------------
    function showList() {
      show('listScreen');
      Tracker.setPage({ topic: topicId, level, mode: 'list' });
      const stats = VocabStats.get(topicId);
      document.getElementById('listTitle').textContent = level === 'sentences' ? 'רשימת המשפטים' : 'רשימת המילים';
      const rows = [...vocabItems(content, level)];
      if (level === 'words') rows.sort((a, b) => a.en.localeCompare(b.en, 'en', { sensitivity: 'base' }));
      const table = document.getElementById('wordTable');
      table.innerHTML = rows.map((w, i) => {
        const s = stats[w.en];
        const mark = !s ? '' : VocabStats.needsWork(s) ? '💪' : '✅';
        return `<tr>
          <td class="wt-en" dir="ltr" lang="en">${escapeHtml(w.en)}</td>
          <td class="wt-he">${escapeHtml(w.he)}</td>
          <td class="wt-mark">${mark}</td>
          <td><button type="button" class="speak-btn" data-i="${i}" title="השמעה">🔊</button></td>
        </tr>`;
      }).join('');
      table.querySelectorAll('.speak-btn').forEach(b =>
        b.onclick = () => playEnglish(rows[+b.dataset.i].en));
    }

    init();
  </script>
</body>
</html>
